[project]
name = "mcp-simple-chatbot"
version = "0.1.0"
description = "A simple chatbot using the Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Advanced Micro Devices, Inc" }]
keywords = ["mcp", "llm", "chatbot", "cli"]
license = { text = "MIT" }
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.25.0",
    "openai>=2.15.0",
    "pydantic>=2.12.5",
    "termcolor>=3.3.0",
    "streamlit>=1.57.0"
]

[project.scripts]
mcp-simple-chatbot = "adlx_mcp_chatbot.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adlx_mcp_chatbot"]

[tool.pyright]
include = ["adlx_mcp_chatbot"]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff]
line-length = 88
target-version = "py313"

[dependency-groups]
dev = ["pyright>=1.1.379", "pytest>=8.3.3", "ruff>=0.6.9", "pyinstaller>=6.18.0"]